services:
  bot:
    build: .
    image: bot-istimewa:v3
    container_name: bot-istimewa
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: .env
    environment:
      APP_HOST: "0.0.0.0"
      TZ: "Asia/Jakarta"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${APP_PORT:-3000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
